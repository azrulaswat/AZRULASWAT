<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#060b17">

  <meta property="og:title" content="Azrul Aswat | Instrumentation, Electrical & Automation">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="wave" aria-hidden="true"></canvas>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="glow g1" aria-hidden="true"></div>
  <div class="glow g2" aria-hidden="true"></div>

  <main class="card">
    <header class="top">
      <span class="tag"><i></i> E&amp;I // PORTFOLIO</span>
      <button id="shareBtn" class="share" aria-label="Bagikan halaman">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
    </header>

    <section class="hero">
      <div class="avatar-wrap reveal" style="--d:0ms">
        <div class="ring"></div>
        <div id="avatar" class="avatar">AA</div>
      </div>
      <h1 id="name" class="reveal" style="--d:100ms">Azrul Aswat</h1>
      <p id="username" class="handle reveal" style="--d:160ms"></p>
      <p id="role" class="role reveal" style="--d:220ms"></p>
      <p id="bio" class="bio reveal" style="--d:280ms"></p>
      <span id="status" class="status reveal" style="--d:340ms"><i></i> Open to Opportunities</span>
    </section>

    <section id="pillars" class="pillars" aria-label="Bidang keahlian"></section>

    <h2 class="section-label">// TAUTAN</h2>
    <nav id="links" class="links" aria-label="Tautan"></nav>

    <footer>
      <p>&copy; <span id="year"></span> Azrul Aswat</p>
      <p class="mono">4&ndash;20 mA &middot; ONLINE</p>
    </footer>
  </main>

  <div id="toast" class="toast" role="status"></div>
  <script src="script.js"></script>
